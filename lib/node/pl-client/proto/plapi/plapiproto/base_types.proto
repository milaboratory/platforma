syntax = "proto3";

package MiLaboratories.PL.Base;

option go_package = "github.com/milaboratory/pl/plapi/plapiproto;plapiproto";

message ResourceType {
  string name = 1;
  string version = 2;
}

// Kind of a resource: each kind has its own create request.
enum ResourceKind {
  RESOURCE_KIND_UNSPECIFIED = 0; // in a schema: any kind
  RESOURCE_KIND_STRUCTURAL = 1;  // CreateStruct and CreateChild
  RESOURCE_KIND_VALUE = 2;       // CreateValue
  RESOURCE_KIND_ROOT = 3;        // CreateRoot
  RESOURCE_KIND_EPHEMERAL = 4;   // CreateEphemeral
  RESOURCE_KIND_SERVICE = 5;     // created by core only
  RESOURCE_KIND_SINGLETON = 6;   // CreateSingleton
}

enum FieldType {
  INVALID = 0;

  INPUT = 1;
  OUTPUT = 2;
  SERVICE = 6;
  ONE_TIME_WRITABLE = 4;

  DYNAMIC = 3;
  MULTIPLE_TIMES_WRITABLE = 5;
}

message FieldRef {
  uint64 resource_id = 2;
  bytes resource_signature = 4;
  string field_name = 3;
}

message Color {
  uint64 root = 1;
  uint32 permissions = 2;
}
