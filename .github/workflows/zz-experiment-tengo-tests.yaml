name: Experiment workflow-tengo-tests

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
    paths:
      - .github/workflows/zz-experiment-tengo-tests.yaml

permissions:
  id-token: write
  contents: read

env:
  BODY_LIMIT: "1048576000"

jobs:
  shard:
    name: ${{ matrix.shard }} rep${{ matrix.rep }}
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
        shard: [tengo-1, tengo-2, other-a, other-b]
        include:
          - shard: tengo-1
            filter: --filter=@platforma-sdk/workflow-tengo-tests
            args: -- --shard=1/2
          - shard: tengo-2
            filter: --filter=@platforma-sdk/workflow-tengo-tests
            args: -- --shard=2/2
          - shard: other-a
            filter: >-
              --filter=@milaboratories/drivers-ml-blocks-integration
              --filter=@milaboratories/pl-deployments
              --filter=@milaboratories/milaboratories.test-filter-column.test
          - shard: other-b
            filter: >-
              --filter=!@platforma-sdk/workflow-tengo-tests
              --filter=!@milaboratories/drivers-ml-blocks-integration
              --filter=!@milaboratories/pl-deployments
              --filter=!@milaboratories/milaboratories.test-filter-column.test
    runs-on: hz-ubuntu-dind
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_ZEN_APP_ID }}
          private-key: ${{ secrets.GH_ZEN_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          npmjs-token: ${{ secrets.NPMJS_TOKEN }}
          github-token: ${{ steps.app-token.outputs.token }}
          aws-iam-role: ${{ secrets.AWS_CI_IAM_MONOREPO_SIMPLE_ROLE }}
          turbo-s3-bucket: ${{ vars.HZ_CI_TURBO_S3_BUCKET }}
          turbo-s3-endpoint: https://${{ vars.HZ_CI_TURBO_S3_ENDPOINT }}
          turbo-s3-region: ${{ vars.HZ_CI_TURBO_S3_REGION }}
          turbo-s3-access-key: ${{ secrets.HZ_CI_TURBO_S3_ACCESS_KEY }}
          turbo-s3-secret-key: ${{ secrets.HZ_CI_TURBO_S3_SECRET_KEY }}
          cache-s3-access-key: ${{ secrets.HZ_CI_CACHE_S3_ACCESS_KEY }}
          cache-s3-secret-key: ${{ secrets.HZ_CI_CACHE_S3_SECRET_KEY }}
          quay-username: ${{ secrets.QUAY_USERNAME }}
          quay-robot-token: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Build
        env:
          NPMJS_TOKEN: ${{ secrets.NPMJS_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PL_DOCKER_REGISTRY_PUSH_TO: "quay.io/milaboratories/pl-containers"
        run: pnpm run ci:build:local

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - name: Start Platforma Docker
        uses: milaboratory/github-ci/actions/docker/pl-compose@v4
        env:
          PL_LICENSE: ${{ secrets.MI_LICENSE }}
          MI_LICENSE: ${{ secrets.MI_LICENSE }}
          PL_HAS_SCRATCH_SPACE: "true"
        with:
          pl-docker-registry: ${{ format('{0}/{1}', steps.ecr-login.outputs.registry, 'pl') }}
          pl-docker-tag: main
          pl-test-assets-dir: assets
          pl-log-level: info

      - name: Run tests
        env:
          PL_ADDRESS: "http://127.0.0.1:6345"
          PL_TEST_USER: ${{ secrets.PL_CI_TEST_USER }}
          PL_TEST_PASSWORD: ${{ secrets.PL_CI_TEST_PASSWORD }}
          PL_LICENSE: ${{ secrets.MI_LICENSE }}
          MI_LICENSE: ${{ secrets.MI_LICENSE }}
          NPMJS_TOKEN: ${{ secrets.NPMJS_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_CACHE_CRUTCH: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.rep }}
          PL_BUILD_CHANNEL: dev
          PL_BUILD_VARIANT: binary
          PL_BUILD_LOCATION: local
        run: |
          start=$(date +%s)
          set +e
          pnpm exec turbo run test --concurrency 1 --continue --summarize \
            ${{ matrix.filter }} --output-logs=errors-only ${{ matrix.args }}
          code=$?
          set -e
          echo "Turbo wall time: $(( $(date +%s) - start ))s, exit code $code" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code
