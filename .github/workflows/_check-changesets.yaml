name: _check-changesets

on:
  workflow_call:
    outputs:
      has-pending:
        description: Whether there are pending changesets
        value: ${{ jobs.check-changesets.outputs.has-pending }}

jobs:
  check-changesets:
    runs-on: hz-ubuntu-dind
    outputs:
      has-pending: ${{ steps.check.outputs.has-pending }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm and Node from devEngines
        uses: milaboratory/github-ci/actions/node/setup-pnpm@v4
        with:
          cache: 'false'

      - name: Check change intents
        run: |
          node scripts/check-change-intents.mjs origin/main
          pnpm change check

      - name: Check for pending change intents
        id: check
        run: |
          if compgen -G '.changeset/*.md' > /dev/null; then
            echo "has-pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-pending=false" >> "$GITHUB_OUTPUT"
          fi
