name: Main

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  id-token: write
  packages: write
  contents: write
  pull-requests: write
  issues: read

env:
  BODY_LIMIT: "1048576000"

jobs:
  # ──────────────────────────────────────────────
  # 1. Init
  # ──────────────────────────────────────────────
  init:
    runs-on: hz-ubuntu-dind
    outputs:
      is-release: ${{ steps.context.outputs.is-release }}
      current-version: ${{ steps.context.outputs.current-version }}
    steps:
      - id: context
        uses: milaboratory/github-ci/actions/context/init@v4
        with:
          version-canonize: false
          branch-versioning: main

  # ──────────────────────────────────────────────
  # 2. Check changesets
  # ──────────────────────────────────────────────
  check-changesets:
    uses: ./.github/workflows/_check-changesets.yaml
    secrets: inherit

  # ──────────────────────────────────────────────
  # 3. Check pnpm consistency (reusable)
  # ──────────────────────────────────────────────
  check-pnpm-consistency:
    uses: ./.github/workflows/_check.yaml
    secrets: inherit

  # ──────────────────────────────────────────────
  # 4. Test (reusable)
  # ──────────────────────────────────────────────
  test:
    needs: [init]
    uses: ./.github/workflows/_test.yaml
    secrets: inherit

  # ──────────────────────────────────────────────
  # 5. Publish
  # ──────────────────────────────────────────────
  publish:
    runs-on: hz-ubuntu-dind
    needs: [init, check-pnpm-consistency, test, check-changesets]
    if: ${{ !failure() && !cancelled() && needs.check-changesets.outputs.has-pending == 'true' }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_ZEN_APP_ID }}
          private-key: ${{ secrets.GH_ZEN_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          npmjs-token: ${{ secrets.NPMJS_TOKEN }}
          github-token: ${{ steps.app-token.outputs.token }}
          aws-iam-role: ${{ secrets.AWS_CI_IAM_MONOREPO_SIMPLE_ROLE }}
          # Caches → RGW: turbo to ci-turbo-cache, pnpm to ci-actions-cache (both
          # use-fallback → GitHub). Shared org secrets/vars (selected to platforma).
          turbo-s3-bucket: ${{ vars.HZ_CI_TURBO_S3_BUCKET }}
          turbo-s3-endpoint: https://${{ vars.HZ_CI_TURBO_S3_ENDPOINT }}
          turbo-s3-region: ${{ vars.HZ_CI_TURBO_S3_REGION }}
          turbo-s3-access-key: ${{ secrets.HZ_CI_TURBO_S3_ACCESS_KEY }}
          turbo-s3-secret-key: ${{ secrets.HZ_CI_TURBO_S3_SECRET_KEY }}
          cache-s3-access-key: ${{ secrets.HZ_CI_CACHE_S3_ACCESS_KEY }}
          cache-s3-secret-key: ${{ secrets.HZ_CI_CACHE_S3_SECRET_KEY }}
          quay-username: ${{ secrets.QUAY_USERNAME }}
          quay-robot-token: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Run changeset version
        run: pnpm run version-packages

      - name: Build for publish (full, non-local)
        env:
          NPMJS_TOKEN: ${{ secrets.NPMJS_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PL_RELEASE_BINARY_UPLOAD_URL: ${{ secrets.PL_REGISTRY_PLOPEN_UPLOAD_URL }}
        run: pnpm run ci:build:release

      - name: Security scan
        uses: milaboratory/github-ci/actions/docker/scan-pnpm-repo@v4

      # npm trusted publishing (OIDC) is accepted only from GitHub-hosted
      # runners: everything but the upload happens here, the `npm-publish` job
      # uploads. Each package needs a trusted publisher on npmjs.com naming
      # this repository and main.yaml. A package new to npm has no trusted
      # publisher yet and pack refuses it: publish its first version by hand
      # (npm publish with 2FA), add its trusted publisher, re-run the job.
      # setup-pnpm installs Node without npm, and pack-unpublished calls npm.
      # 11.19.1 is the npm that Node 24.22.0 bundles.
      - name: Install npm
        run: pnpm add -g npm@11.19.1

      - name: Pack unpublished packages
        id: npm-pack
        uses: milaboratory/github-ci/actions/node/pack-unpublished@v4
        with:
          output-dir: ${{ runner.temp }}/npm-tarballs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPMJS_TOKEN: ${{ secrets.NPMJS_TOKEN }}
          # The action runs npm in the repo root; devEngines names pnpm, so npm fails there without --force.
          npm_config_force: "true"
          PL_REGISTRY_PLATFORMA_OPEN_UPLOAD_URL: ${{ secrets.PL_REGISTRY_PLOPEN_UPLOAD_URL }}

      # The version bump is committed only after the upload succeeds (as
      # before, when it followed `pnpm -r publish`): otherwise a failed upload
      # would leave versions on main that were never published, with no
      # pending changesets left to retry them.
      - name: Save version changes
        run: |
          git add -A
          git diff --cached --binary > "${RUNNER_TEMP}/version.patch"
          git diff --cached --stat

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: npm-release
          path: |
            ${{ steps.npm-pack.outputs.dir }}
            ${{ runner.temp }}/version.patch
          retention-days: 7
          overwrite: true

    outputs:
      npm-pack-count: ${{ steps.npm-pack.outputs.count }}

  # ──────────────────────────────────────────────
  # 6. npm upload (trusted publishing) + version commit
  # ──────────────────────────────────────────────
  npm-publish:
    # GitHub-hosted: npm rejects OIDC tokens from self-hosted runners.
    runs-on: ubuntu-latest
    needs: [publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      id-token: write
      contents: write
      packages: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_ZEN_APP_ID }}
          private-key: ${{ secrets.GH_ZEN_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release

      - name: Publish npm packages
        if: needs.publish.outputs.npm-pack-count != '0'
        uses: milaboratory/github-ci/actions/node/publish-tarballs@v4
        with:
          dir: ${{ runner.temp }}/npm-release/npm-tarballs
          access-public: 'true'
          npm-auth-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get GitHub App User ID
        id: get-user-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Commit and push version changes
        env:
          USER_ID: ${{ steps.get-user-id.outputs.user-id }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          PATCH: ${{ runner.temp }}/npm-release/version.patch
        run: |
          git apply --index "${PATCH}"
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git checkout main
          git commit -m "Version packages [skip ci]"
          git push

  # ──────────────────────────────────────────────
  # 7. Notify
  # ──────────────────────────────────────────────
  notify:
    runs-on: hz-ubuntu-dind
    if: always()
    needs: [init, check-changesets, check-pnpm-consistency, test, publish, npm-publish]
    steps:
      - id: search-tags
        uses: milaboratory/github-ci/actions/strings/json-list@v4
        with:
          input: release

      - uses: milaboratory/github-ci/blocks/notify/slack/release@v4
        with:
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel: ${{ secrets.SLACK_PL_SDK_CHANNEL }}
          job-status: |
            ${{ needs.check-pnpm-consistency.result }}
            ${{ needs.test.result }}
            ${{ needs.check-changesets.result }}
            ${{ needs.publish.result }}
            ${{ needs.npm-publish.result }}
            ${{ needs.check-changesets.result }}
          product-name: Platforma SDK
          search-tags: ${{ steps.search-tags.outputs.result }}
