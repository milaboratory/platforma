name: _check-pnpm-consistency

on:
  workflow_call: {}

jobs:
  check-pnpm-consistency:
    runs-on: hz-ubuntu-dind
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm and Node from devEngines
        uses: milaboratory/github-ci/actions/node/setup-pnpm@v4
        with:
          cache: 'false'

      - name: Check that pnpm-lock.yaml matches pnpm-workspace.yaml
        run: pnpm install --frozen-lockfile --lockfile-only
