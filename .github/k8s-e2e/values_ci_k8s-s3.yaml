# Copy of helm/internal/values_ci_k8s-s3.yaml in milaboratory/pl. The chart sync to the public
# platforma-helm repo leaves out helm/internal/, and this repo has no token that reads pl.
# Keep it equal to the pl file.

# =============================================================================
# CI E2E Values Override — K8s Runner + Garage S3 (Shared Kueue)
# =============================================================================
# Used by e2e-tests.yaml to deploy Platforma with:
#   - K8s runner via Kueue (shared mode — references existing ClusterQueues)
#   - Garage S3 for primary storage (running in common-services namespace)
#   - htpasswd auth (per-run secret created by reusable workflow)
#   - Small CI-appropriate resource limits
#
# Overrides applied at deploy time:
#   --set image.tag=<version>
#   --set auth.htpasswd.secretName=<release>-htpasswd
# =============================================================================

# -- Image pull policy: use pre-pulled images on CI nodes
image:
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: regcred

# =============================================================================
# LICENSE
# =============================================================================

license:
  secretName: "platforma-license"
  secretKey: "MI_LICENSE"

# =============================================================================
# AUTHENTICATION
# =============================================================================
# htpasswd secret created per-run by the reusable workflow before helm deploy.
# Secret name is injected via --set auth.htpasswd.secretName=<release>-htpasswd

auth:
  htpasswd:
    credentials: []
    secretName: ""
  ldap:
    server: ""

# =============================================================================
# STORAGE
# =============================================================================

storage:
  # -- Database (RWO): small size for CI. local-path-nvme = node-local NVMe on
  # cluster-e2e-1, where the backend is pinned. The e2e nodes are in Helsinki,
  # ~40 ms from Ceph in FSN, so RBD (ceph-nvme) would put every RocksDB write on
  # that link (MILAB-7218, same layout as pl's helm/internal/values_ci_k8s-s3.yaml).
  database:
    size: 5Gi
    storageClass: "local-path-nvme"

  # -- Workspace: RWX so the Platforma pod + k8s-mode job pods share it.
  # nfs-e2e = NFS export on cluster-e2e-1 (ceph-fs is ~40 ms away in FSN).
  workspace:
    pvc:
      enabled: true
      accessMode: ReadWriteMany
      size: 10Gi
      chownOnCreate: false
      storageClass: "nfs-e2e"

  # -- Main storage: Hetzner RadosGW (Ceph RGW). The e2e workflow injects a
  # per-run prefix (--set storage.main.s3.prefix=<release>-primary/) matching the
  # data-handler. noDataIntegrity true for Ceph; in-cluster endpoint (e2e runs on hz).
  main:
    type: s3
    s3:
      bucket: "platforma-e2e-storage"
      region: "us-east-1"
      prefix: ""
      # Split-DNS: one canonical endpoint everywhere. Resolves to the in-cluster RGW
      # ClusterIP from inside the cluster (fast fabric) and the public storage IPs
      # from outside — so backend reads and Desktop presigned URLs use the same URL.
      endpoint: "https://s3.hz.platforma.bio"
      externalEndpoint: "https://s3.hz.platforma.bio"
      noDataIntegrity: true
      secretRef:
        name: "platforma-e2e-s3-credentials"
        accessKeyField: "access-key"
        secretKeyField: "secret-key"

# =============================================================================
# JOB EXECUTION (Kueue — Shared Mode)
# =============================================================================
# Uses the platforma-e2e-* ClusterQueues and WorkloadPriorityClasses created by the
# staging release (pl helm/internal/values_staging.hz.yaml, clusterResourceName:
# platforma-e2e). They cover the dedicated e2e nodes and are not in any cohort, so
# platforma-app (ecoteam) load on platforma-batch can't starve these runs.

kueue:
  mode: shared

  maxJobResources:
    cpu: 4
    memory: 8Gi

  # Jobs run on cluster-e2e-1 (cluster-e2e-2 runs only the CI runners). The
  # platforma-e2e-* ResourceFlavors carry the same selector + toleration; set here
  # too so the pods themselves match.
  pools:
    ui:
      nodeSelector:
        node.kubernetes.io/role: e2e
        kubernetes.io/hostname: cluster-e2e-1
      tolerations:
        - { key: dedicated, operator: Equal, value: e2e, effect: NoSchedule }
    batch:
      nodeSelector:
        node.kubernetes.io/role: e2e
        kubernetes.io/hostname: cluster-e2e-1
      tolerations:
        - { key: dedicated, operator: Equal, value: e2e, effect: NoSchedule }
    # -- GPU node pools
    # Routes GPU jobs via nodeAffinity on platforma.bio/gpu-memory-gib label.
    # K8s scheduler + Cluster Autoscaler pick the cheapest node with enough VRAM.
    # One job per GPU node (nvidia.com/gpu: 1 enforces exclusive access).
    gpu:
      enabled: false

  shared:
    # Created by the staging release (clusterResourceName: platforma-e2e). Names
    # must follow staging's prefix.
    clusterQueues:
      ui: "platforma-e2e-ui"
      batch: "platforma-e2e-batch"
    workloadPriorityClasses:
      uiTasks: "platforma-e2e-ui"
      high: "platforma-e2e-high"
      normal: "platforma-e2e-normal"
      low: "platforma-e2e-low"

# =============================================================================
# DATA SOURCES (data libraries for tests)
# =============================================================================

dataSources:
  # test-assets lives in our in-cluster RGW (migrated off AWS S3). The chart's
  # dataSources block has no `endpoint` field, so it emits the s3:// form + injects
  # the key/secret env from secretRef. We override ONLY the URL to the RGW
  # S3-compatible endpoint form via app.extraArgs below (rendered after this block;
  # --data-library-s3 is a go-flags map keyed by lib name, so the later value wins).
  - name: "test-assets"
    type: s3
    s3:
      bucket: "platforma-e2e-test-assets"
      region: "eu-central-1"
      prefix: "test-assets/"
      endpoint: "https://s3.hz.platforma.bio/"
      secretRef:
        name: "platforma-e2e-s3-credentials"
        accessKeyField: "access-key"
        secretKeyField: "secret-key"

# =============================================================================
# NETWORKING
# =============================================================================
# No ingress needed — tests connect via cluster-internal service DNS.

ingress:
  enabled: false

# =============================================================================
# APPLICATION
# =============================================================================

app:
  # Backend pod on cluster-e2e-1: fast CPU, the NFS workspace server, and the NVMe
  # with good fsync for the DB (local-path-nvme follows the pod). cluster-e2e-2
  # runs only the privileged test runners (hz-ubuntu-dind-e2e).
  nodeSelector:
    node.kubernetes.io/role: e2e
    kubernetes.io/hostname: cluster-e2e-1
  tolerations:
    - { key: dedicated, operator: Equal, value: e2e, effect: NoSchedule }

  resources:
    requests:
      # Measured ~2 CPU per backend during a run (p50; p95 3.1, 14 days on hz).
      # Requesting real use keeps the scheduler from overpacking cluster-e2e-1.
      cpu: "2"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 4Gi

  debug:
    enabled: true

  # Grant testuser1 admin role via the env form of --admin-user (PL_ADMIN_USERS). The
  # MILAB-5933 admin test flows (alternative roots, user-root creation) require an admin
  # login. Using env avoids the extraArgs[2] collision with the reusable workflow's
  # --k8s-job-name-prefix injection (a dense YAML list can't add a 4th arg without
  # renumbering that hardcoded index). The htpasswd (reusable workflow) has only
  # testuser1, so it serves as both the regular and the admin test user.
  # Trust the public ECR the in-repo software images are pushed to (env form of
  # --trusted-docker-registry, matched by registry host). The test-command builds
  # ptabler and ptexter during the run and autopushes them to
  # public.ecr.aws/u5p1x5q2/pl-containers; without this the backend refuses every
  # command that uses them. Packages pulled from the default containers.pl-open.science
  # are trusted already.
  env:
    variables:
      PL_ADMIN_USERS: "testuser1"
      PL_TRUSTED_DOCKER_REGISTRY: "public.ecr.aws"

  # index 0, 1 defined here; index 2 is injected by the e2e-tests reusable workflow:
  #   --set "app.extraArgs[2]=--k8s-job-name-prefix=<release>-"
  # --k8s-max-cpu-request / --k8s-max-ram-request are NOT listed here because the
  # chart already emits them from kueue.maxJobResources; duplicating them in extraArgs
  # would pass conflicting values and overwriting index 2 would silently drop them.
  extraArgs:
    # Log to stdout so VictoriaLogs (Vector) + kubectl logs capture backend logs
    # persistently (dir:// is lost when the pod recycles). index 0.
    - "--log-dst=stream://stdout"
    - "--keep-workdirs=24h" # index 1. Is here just to align with e2e-tests workflow.

  logging:
    persistence:
      enabled: false

  # Auth: htpasswd secret injected at deploy time via --set auth.htpasswd.secretName

# =============================================================================
# SERVICE ACCOUNTS
# =============================================================================

serviceAccount:
  create: true
  name: ""
  annotations: {}

jobServiceAccount:
  create: true
  name: ""
  annotations: {}

# =============================================================================
# JOB CONFIGURATION
# =============================================================================

jobs:
  secretName: "platforma-license"

  # Scratch storage. The chart leaves `enabled` unset, which resolves to
  # `environment == "aws"` — false here — so the deploy never passed
  # --has-scratch-space and the backend never advertised 'scratchSpace:v1'.
  # The scratch suites then had nothing to measure and reported an empty
  # command output as a failure.
  #
  # local-path-nvme is the node-local RWO class the database already uses, and
  # the scratch claim is an ephemeral RWO volume made per job and deleted with
  # it, so the class fits without anything new on the cluster. `create: false`
  # keeps the chart from declaring a class it does not own.
  #
  # maxRequest shrinks an oversized ask instead of rejecting it, which keeps a
  # block that asks for hundreds of gigabytes from trying to provision that on
  # a CI cluster sized for 4 CPU / 8Gi jobs. The suites ask for 1-2GiB.
  scratchStorage:
    enabled: true
    network:
      maxRequest: 10Gi
      storageClass:
        create: false
        name: "local-path-nvme"

# =============================================================================
# VALIDATION
# =============================================================================
# Disable secret existence pre-flight checks: the GHA runner service account
# (dev-ci-pl-gha-rs-no-permission) cannot `get namespaces`, so the Helm
# template's `lookup "v1" "Namespace"` call errors instead of returning empty.
# Required secrets are created before helm deploy by the reusable workflow.

validation:
  checkSecrets: false
